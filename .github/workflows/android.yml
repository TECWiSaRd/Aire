name: Android Build & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    
    - name: set up JDK 17
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa8f9c6aa53b591b945
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Create local.properties
      run: touch local.properties

    - name: Build with Gradle
      run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

    - name: Get Version Name
      id: get_version
      run: echo "VERSION=$(grep "versionName" app/build.gradle.kts | head -1 | awk -F'\"' '{print $2}')" >> $GITHUB_ENV

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
      with:
        tag_name: v${{ env.VERSION }}.${{ github.run_number }}
        name: Aire v${{ env.VERSION }} (Build ${{ github.run_number }})
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
